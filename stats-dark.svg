<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="G1 Extended: 0 accounts or telemetry. CMS: 2 blocking requests at any plugin count, down from 30. VectorFix: 3000 times less storage to cover France.">
  <rect x="0" y="0" width="34" height="3" fill="#3987e5"/>
  <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">G1 Extended</text>
  <text x="0" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">0</text>
  <text x="0" y="106" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">no account, no server, no byte</text>
  <text x="0" y="125" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">of telemetry leaving the phone</text>
  <text x="0" y="163" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c3c2b7" opacity="0.8">two BLE radios, driven directly</text>
  <rect x="310" y="0" width="34" height="3" fill="#d95926"/>
  <text x="310" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">CMS</text>
  <text x="310" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">2</text>
  <text x="310" y="106" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">blocking requests before paint,</text>
  <text x="310" y="125" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">whatever the plugin count</text>
  
    <line x1="310" y1="156" x2="500" y2="156" stroke="#2c2c2a" stroke-width="1"/>
    <line x1="321.875" y1="156" x2="488.125" y2="156" stroke="#d95926" stroke-width="2" opacity="0.45"/>
    <circle cx="488.125" cy="156" r="5" fill="#6e3d29"/>
    <circle cx="321.875" cy="156" r="5" fill="#d95926"/>
    <text x="488.125" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#898781">30</text>
    <text x="321.875" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c3c2b7">2</text>
    <text x="310" y="178" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#898781">WordPress, 15 plugins → this</text>
  <rect x="620" y="0" width="34" height="3" fill="#199e70"/>
  <text x="620" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">VectorFix</text>
  <text x="620" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">3000×</text>
  <text x="620" y="106" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">less storage to cover France:</text>
  <text x="620" y="125" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="13" fill="#898781">1–3 GB of vector, not 5–10 TB</text>
  <text x="620" y="163" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c3c2b7" opacity="0.8">on an ESP32-S3, at ~0.5 W</text>
</svg>
