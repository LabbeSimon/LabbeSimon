<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="G1 Extended: 0 accounts, servers or telemetry. CMS: 2 blocking requests at any plugin count, down from 30. VectorFix: 3000 times less storage to cover France. Start Browser: 0 pings home, telemetry and Mozilla services off.">
  <rect x="0" y="0" width="34" height="3" fill="#3987e5"/>
  <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">G1 Extended</text>
  <text x="0" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">0</text>
  <text x="0" y="104" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">no account, no server, no</text>
  <text x="0" y="121" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">telemetry leaving the phone</text>
  <text x="0" y="160" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c3c2b7" opacity="0.8">two BLE radios, no middleman</text>
  <rect x="231" y="0" width="34" height="3" fill="#d95926"/>
  <text x="231" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">CMS</text>
  <text x="231" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">2</text>
  <text x="231" y="104" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">blocking requests before</text>
  <text x="231" y="121" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">paint, at any plugin count</text>
  
    <line x1="231" y1="156" x2="401" y2="156" stroke="#2c2c2a" stroke-width="1"/>
    <line x1="241.625" y1="156" x2="390.375" y2="156" stroke="#d95926" stroke-width="2" opacity="0.45"/>
    <circle cx="390.375" cy="156" r="5" fill="#6e3d29"/>
    <circle cx="241.625" cy="156" r="5" fill="#d95926"/>
    <text x="390.375" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#898781">30</text>
    <text x="241.625" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c3c2b7">2</text>
    <text x="231" y="176" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#898781">WordPress, 15 plugins → this</text>
  <rect x="462" y="0" width="34" height="3" fill="#199e70"/>
  <text x="462" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">VectorFix</text>
  <text x="462" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">3000×</text>
  <text x="462" y="104" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">less storage to cover</text>
  <text x="462" y="121" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">France: 1–3 GB, not 5–10 TB</text>
  <text x="462" y="160" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c3c2b7" opacity="0.8">on an ESP32-S3, at ~0.5 W</text>
  <rect x="693" y="0" width="34" height="3" fill="#c98500"/>
  <text x="693" y="30" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#c3c2b7">Start Browser</text>
  <text x="693" y="80" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#ffffff">0</text>
  <text x="693" y="104" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">pings home: telemetry and</text>
  <text x="693" y="121" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="12" fill="#898781">Mozilla services are off</text>
  <text x="693" y="160" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c3c2b7" opacity="0.8">no engine source in the repo</text>
</svg>
